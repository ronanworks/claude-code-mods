<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>html-shelf demo</title>
<style>
  .viewer { position: absolute; border-radius: 10px; overflow: hidden; background: #202020; z-index: 20; display: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 30px 80px rgba(0,0,0,0.65), 0 10px 28px rgba(0,0,0,0.45); }
  .v-bar { height: 36px; display: flex; align-items: center; padding-left: 14px; color: #e6e6e6; font-size: 12.5px; position: relative; gap: 10px; }
  .v-bar .ic { width: 14px; height: 11px; border-radius: 2px; border: 1.5px solid #9ad0ff; box-sizing: border-box; }
  .v-ctl { position: absolute; right: 0; top: 0; height: 36px; display: flex; }
  .v-ctl div { width: 42px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .v-tools { height: 34px; display: flex; align-items: center; justify-content: center; gap: 22px; color: #bdbdbd; font-size: 12px; border-bottom: 1px solid #2c2c2c; }
  .v-tools b { font-weight: 600; color: #e6e6e6; }
  .v-img { position: relative; margin: 14px auto 0; width: 520px; height: 292px; border-radius: 3px; overflow: hidden;
    background: linear-gradient(180deg, #2b1d4d 0%, #6b3a73 38%, #d9775a 70%, #f2b36d 86%, #3a2a36 86.2%, #1c1720 100%); }
  .v-img .sun { position: absolute; left: 336px; top: 128px; width: 86px; height: 86px; border-radius: 50%;
    background: radial-gradient(circle, #ffe2a8 0%, #ffc777 55%, rgba(255,199,119,0) 72%); }
  .v-img .m1 { position: absolute; left: -30px; right: -30px; bottom: 40px; height: 120px; background: #3d2547;
    clip-path: polygon(0 100%, 8% 52%, 17% 70%, 29% 22%, 41% 64%, 52% 40%, 63% 72%, 76% 30%, 88% 62%, 100% 44%, 100% 100%); }
  .v-img .m2 { position: absolute; left: -30px; right: -30px; bottom: 40px; height: 74px; background: #251a2e;
    clip-path: polygon(0 100%, 0 60%, 12% 38%, 24% 66%, 37% 48%, 50% 74%, 62% 34%, 75% 58%, 88% 42%, 100% 70%, 100% 100%); }
  .v-img .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
    background: repeating-linear-gradient(90deg, rgba(242,179,109,0.20) 0 1px, transparent 1px 34px), linear-gradient(180deg, #2a1f2e, #141016); }
  .v-foot { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #9b9b9b; font-size: 12px; }
</style>
</head>
<body>
<script type="module">
import { Grid, drawGrid, metrics } from '../lib/cells.js'
import { makeStage, termWindow, makePointer, makeToast, toastK, canvasLayer, pathAt, seg, easeOut, easeOutBack, easeInOut, lerp } from '../lib/stage.js'
import { transcript, inputBox, hint, C } from '../lib/claude.js'

const COLS = 96, ROWS = 23, CW = 10, CH = 20, SIZE = 17.06
const W = 1200, H = 606
const FPS = 20, DURATION = 11.0

// ---------------- html-shelf 0.6 的画法 (按 register.tsx; 颜色是主题色) ----------------
const TITLE_BG = 'rgb(55,55,55)' // userMessageBackground
const TITLE_BG_HOT = 'rgb(70,70,70)' // userMessageBackgroundHover
const CODE_BG = 'rgb(38,38,38)' // composerSidebarBackground
const DIMBTN = 'rgb(118,118,118)' // Button plain dimColor (近似)
const ORANGE = 'rgb(215,119,87)' // hover: { color: 'claude', bold: true }
const GREEN = 'rgb(78,186,101)' // success
const INVERT = { fg: '#1c1917', bg: ORANGE, bold: true } // 指针正压在按钮上: 反色
// 代码高亮 (引擎的 <Code> 画的, 配色近似)
const SYN = { cmd: 'rgb(110,168,254)', plain: 'rgb(222,222,222)' }

// 行号
// 卡片 = 标题栏 1 行 + 代码区 (上下各空一行, paddingY 1) 3 行
const R_REPLY1 = 3, R_CARD = 5, R_CODE = 7, R_REPLY2 = 10, R_LIST = 12, R_TOOL = 16, R_INPUT = 19
// 0.6.1 起按钮文字是英文 (register.tsx 的 LABEL); toast 仍是中文
const LABEL = { copy: 'Copy', copied: 'Copied ✓', insert: 'Insert', copyAll: 'Copy all', open: 'Open' }
// 没标语言、只有一行、以 ! 开头 = 看起来像命令 (LOOKS_LIKE_CMD) -> 也有 Insert; 填入时不重复加 !
const CMD = String.raw`! powershell -File scripts\setup\install.ps1`
const FILLED = '!' + CMD.replace(/^!\s*/, '')
const CARD = { c0: 2, c1: COLS } // 卡片占满消息宽度 ("● " 之后)
// 标题栏右侧 (没标语言: 只有按钮, 靠右): [Insert] 两格空 [Copy] , 右内边距 2
const COPY_COLS = [COLS - 2 - 4, COLS - 2]
const FILL_COLS = [COPY_COLS[0] - 2 - 6, COPY_COLS[0] - 2]
// "复制全文": 回复第一行是正文 -> right = 0; 小底块左右各 1 格内边距
const CHIP = { c0: COLS - 10, c1: COLS }
const LIST = [
  ['docs/report.pdf', '跑分报告'],
  ['renders/shot-01.png', '第一张渲染图'],
  ['renders/', '全部渲染图'],
]
const TOOL = { name: 'Write', args: 'docs/notes.md', result: 'Wrote 18 lines to docs/notes.md' }
const OPEN_COL = 2 + TOOL.name.length + TOOL.args.length + 2 + 2 // 工具行后面 marginLeft 2

// ---------------- 剧情 ----------------
const CLICK_FILL = 1.6
const CLICK_PNG = 3.15
const CLICK_ALL = 6.8
const COPIED_MS = 1800
const FADE_AT = 10.6

makeStage(W, H)
const winX = Math.round((W - (COLS * CW + 24)) / 2)
const win = termWindow({ x: winX, y: 68, cols: COLS, rows: ROWS, cw: CW, ch: CH, size: SIZE, title: 'my-app' })
const body = win.el.querySelector('.termbody')
body.style.position = 'relative'
const fadeLayer = canvasLayer(body, 12, 9, COLS * CW, ROWS * CH, 20)
const at = (r, c) => [win.originX + c * CW, win.originY + r * CH]
const linkCol = i => 4 // "- " 之后
// 指针路线: [时间, x, y] (箭头尖端)
const P0 = at(R_INPUT + 2.6, 70)
const keys = [
  [0, ...P0],
  [0.25, ...P0],
  [0.95, ...at(R_CODE + 0.55, 36)],
  [1.15, ...at(R_CODE + 0.55, 36)],
  [1.45, ...at(R_CARD + 0.6, FILL_COLS[0] + 3.2)],
  [2.25, ...at(R_CARD + 0.6, FILL_COLS[0] + 3.2)],
  [2.95, ...at(R_LIST + 1.6, linkCol(1) + 10)],
  [5.85, ...at(R_LIST + 1.6, linkCol(1) + 10)],
  [6.55, ...at(R_REPLY2 + 0.6, CHIP.c0 + 5.5)],
  [7.4, ...at(R_REPLY2 + 0.6, CHIP.c0 + 5.5)],
  [8.0, ...at(R_TOOL + 0.6, 12)],
  [8.9, ...at(R_TOOL + 0.6, 12)],
  [9.6, ...P0],
]
const alphaAt = t => Math.min(seg(t, 0.15, 0.4), 1 - seg(t, 9.3, 9.6))

// 指针在哪个悬停范围里 (按 index.d.ts: 有 key 的 Box 是一个范围, 指针在它上面任何位置都算)
function hover(t) {
  const [px, py] = pathAt(keys, t)
  const c = (px - win.originX) / CW
  const r = Math.floor((py - win.originY) / CH)
  const inRows = (a, b) => r >= a && r <= b
  const on = (cols) => c >= cols[0] && c < cols[1]
  return {
    card: inRows(R_CARD, R_CARD + 3) && c >= CARD.c0 && c < CARD.c1,
    onFill: r === R_CARD && on(FILL_COLS),
    onCopy: r === R_CARD && on(COPY_COLS),
    reply1: inRows(R_REPLY1, R_CARD + 3) && c >= 0 && c < COLS,
    reply2: inRows(R_REPLY2, R_LIST + 2) && c >= 0 && c < COLS,
    chip2: r === R_REPLY2 && on([CHIP.c0, CHIP.c1]),
    tool: inRows(R_TOOL, R_TOOL + 1) && c >= 0 && c < COLS,
  }
}

function chip(g, row, h, hot, copied) {
  // 刚复制过: 不等悬停直接显示 "已复制 ✓"; 否则只在指针停在这条回复上时出现
  if (!copied && !h) return
  const bg = hot ? TITLE_BG : CODE_BG
  g.bg(row, CHIP.c0, CHIP.c1, bg)
  if (copied) g.text(row, CHIP.c0 + 1, LABEL.copied, { fg: GREEN, bg })
  else g.text(row, CHIP.c0 + 1, LABEL.copyAll, hot ? { fg: ORANGE, bg, bold: true } : { fg: DIMBTN, bg })
}

function drawTerminal(ctx, m, t) {
  const g = new Grid(COLS, ROWS)
  const h = hover(t)
  const filled = t >= CLICK_FILL + 0.08
  const copiedAll = t >= CLICK_ALL && t < CLICK_ALL + COPIED_MS / 1000
  // 第一条回复: 一句话 + 一张单行 PowerShell 卡片
  transcript(g, 0, [{ kind: 'user', text: '整理一下这次的渲染结果，写个说明' }, { kind: 'text', text: '要在别的机器上重跑，先装依赖：' }])
  g.bg(R_CARD, CARD.c0, CARD.c1, h.card ? TITLE_BG_HOT : TITLE_BG)
  const btn = (label, cols, under) => g.text(R_CARD, cols[0], label, under ? INVERT : h.card ? { fg: ORANGE, bold: true } : { fg: DIMBTN })
  btn(LABEL.insert, FILL_COLS, h.onFill)
  btn(LABEL.copy, COPY_COLS, h.onCopy)
  // 代码区: 上下各空一行 (paddingY 1); 没标语言, 引擎按纯文本画
  for (let r = R_CARD + 1; r <= R_CARD + 3; r++) g.bg(r, CARD.c0, CARD.c1, CODE_BG)
  g.text(R_CODE, CARD.c0 + 2, CMD, { fg: SYN.plain })
  chip(g, R_REPLY1, h.reply1, false, false)
  // 第二条回复: 文件路径变成链接 (文件 / 图片 / 文件夹都能点)
  g.text(R_REPLY2, 0, '●', { fg: C.text })
  g.text(R_REPLY2, 2, '渲染结果在这里：', { fg: C.text })
  LIST.forEach(([path, note], i) => {
    const r = R_LIST + i
    g.runs(r, 2, [['- ', { fg: C.text }], [path, { fg: C.link, ul: true }], [' ' + note, { fg: C.text }]])
  })
  chip(g, R_REPLY2, h.reply2, h.chip2, copiedAll)
  if (h.chip2 && !copiedAll) g.text(R_REPLY2, CHIP.c0 + 1, LABEL.copyAll, INVERT)
  // 工具行: Write 写完的文件后面有 "打开" (指针在这一行上时变橙)
  transcript(g, R_TOOL - 1, [{ kind: 'tool', name: TOOL.name, args: TOOL.args, state: 'ok', result: [TOOL.result], after: [[LABEL.open, h.tool ? { fg: ORANGE, bold: true } : { fg: DIMBTN }]] }])
  // 输入框: 填入 = 以 ! 开头放进输入框, 不提交
  inputBox(g, R_INPUT, filled ? FILLED : '', Math.floor(t / 0.53) % 2 === 0)
  hint(g, R_INPUT + 3)
  drawGrid(ctx, g, 0, 0, m)
}

// ---------------- 图片查看器 (示意: 系统默认程序打开 png) ----------------
const VW = 560, VH = 404
const viewer = document.createElement('div')
viewer.className = 'viewer'
viewer.style.cssText += `left:${W - VW - 34}px;top:${160}px;width:${VW}px;height:${VH}px;` // 让开右上角的 toast
viewer.innerHTML = `
  <div class="v-bar"><div class="ic"></div>shot-01.png
    <div class="v-ctl">
      <div><svg width="10" height="10"><rect y="4.5" width="10" height="1" fill="#cfcfcf"/></svg></div>
      <div><svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="#cfcfcf"/></svg></div>
      <div><svg width="10" height="10"><path d="M.5 .5 9.5 9.5M9.5 .5 .5 9.5" stroke="#cfcfcf"/></svg></div>
    </div></div>
  <div class="v-tools"><span>−</span><b>100%</b><span>+</span><span>⟲</span><span>1 / 12</span></div>
  <div class="v-img"><div class="sun"></div><div class="m1"></div><div class="m2"></div><div class="floor"></div></div>
  <div class="v-foot"><span>renders/shot-01.png</span><span>1920 × 1080 · 2.4 MB</span></div>`
document.body.appendChild(viewer)

const pointer = makePointer()
const toast = makeToast(body, 16, 10)
const TOASTS = [
  [CLICK_FILL + 0.1, '已填入输入框，按回车运行'],
  [CLICK_PNG + 0.1, '已打开: shot-01.png'],
  [CLICK_ALL + 0.1, '已复制全文 (5 行)'],
]

// 标题
const cap = document.createElement('div')
cap.className = 'caption'
cap.style.left = winX + 4 + 'px'
cap.style.top = '22px'
cap.innerHTML = '<div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#b1b9f9,#7c86e8);align-self:center;display:flex;align-items:center;justify-content:center;color:#15131c;font:700 12px Cascadia Mono">&lt;/&gt;</div><b>html-shelf</b><span>代码块一键 Copy / Insert 进输入框 · 回复里的文件路径单击就打开 · 悬停 Copy all</span>'
document.body.appendChild(cap)

window.demo = {
  width: W,
  height: H,
  fps: FPS,
  duration: DURATION,
  check: [1.0, 1.4, 2.4, 4.4, 6.65, 7.3, 8.5], // 抽查用的时刻 (秒)
  ready: Promise.all([document.fonts.load('17px "Cascadia Mono"'), document.fonts.load('bold 17px "Cascadia Mono"'), document.fonts.ready]),
  renderFrame(t) {
    const { ctx } = win.begin()
    drawTerminal(ctx, metrics(ctx, CW, CH, SIZE), t)
    const [x, y] = pathAt(keys, t)
    const clicks = [CLICK_FILL, CLICK_PNG, CLICK_ALL]
    pointer.set(x, y, true, clicks.some(c => Math.abs(t - c) < 0.06), alphaAt(t))
    const ck = clicks.map(c => seg(t, c, c + 0.55)).find(k => k > 0 && k < 1)
    pointer.ripple(x, y, ck ?? null, '215,119,87')
    // toast: 同一时刻只显示一条
    const live = TOASTS.map(([a, text]) => [toastK(t, a), text]).find(([k]) => k !== null)
    toast.set(live ? live[1] : '', live ? live[0] : null)
    // 图片查看器: 点 png 后弹出, 一会儿关掉
    const kin = seg(t, CLICK_PNG + 0.15, CLICK_PNG + 0.7)
    const kout = seg(t, 5.55, 5.9)
    const vis = kin > 0 && kout < 1
    viewer.style.display = vis ? 'block' : 'none'
    if (vis) {
      const e = easeOutBack(kin)
      viewer.style.opacity = easeOut(kin) * (1 - easeInOut(kout))
      viewer.style.transform = `translate(${lerp(40, 0, e)}px, ${lerp(18, 0, e) + 10 * kout}px) scale(${lerp(0.93, 1, e) - 0.03 * kout})`
    }
    // 循环衔接
    const k = easeOut(seg(t, FADE_AT, DURATION - 1 / FPS))
    fadeLayer.canvas.style.display = k > 0 ? 'block' : 'none'
    fadeLayer.canvas.style.opacity = k
    if (k > 0) {
      const fctx = fadeLayer.begin('#0c0c0c')
      drawTerminal(fctx, metrics(fctx, CW, CH, SIZE), 0)
    }
  },
}
</script>
</body>
</html>
