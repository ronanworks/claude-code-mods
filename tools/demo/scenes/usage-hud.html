<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>usage-hud demo</title>
</head>
<body>
<script type="module">
import { Grid, drawGrid, metrics } from '../lib/cells.js'
import { makeStage, termWindow, seg, easeOut, typed } from '../lib/stage.js'
import { transcript, inputBox, hint, spinner } from '../lib/claude.js'
import { drawHud, easeAt } from '../lib/hud.js'
import { FRAME_MS, scenePx, setFrame, toolKind } from '../lib/crab.js'

// ---------------- 尺寸 ----------------
const COLS = 128, ROWS = 26, CW = 8, CH = 16, SIZE = 13.65
const W = 1200, H = 578
const FPS = 20, DURATION = 11.4

// ---------------- 剧情 (秒) ----------------
const PROMPT = '给登录页加个「记住我」选项，改完跑一下测试'
const TYPE_AT = 0.35, TYPE_DT = 0.06
const ENTER = 1.8
const TOOLS = [
  { tool: 'Read', name: 'Read', args: 'src/auth/login.ts', start: 2.4, end: 3.2, result: 'Read 86 lines' },
  { tool: 'WebFetch', name: 'Fetch', args: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies', start: 3.5, end: 4.6, result: 'Received 182.4KB (200 OK)' },
  { tool: 'Write', name: 'Write', args: 'src/auth/remember.ts', start: 4.9, end: 6.3, result: 'Wrote 32 lines to src/auth/remember.ts' },
  { tool: 'Bash', name: 'Bash', args: 'npm test -- auth', start: 6.6, end: 7.9, result: 'Tests: 14 passed, 14 total' },
]
const FINAL = '已加上「记住我」：勾选后 30 天内免登录，14 个测试全部通过。'
const FINAL_AT = 8.2, FINAL_END = 8.7
const COMPLETE = 8.8
const CELEBRATE_MS = 1400 // turn.complete: 一轮不到 3 分钟 -> 庆祝 1.4 秒 (源码)
const FADE_AT = 11.0
const FRAME0 = 118 // 螃蟹帧计数的起点: 让开头的闲置状态正好赶上源码里的"挥手" (cyc 120-136)

// 每次模型回复 (= 每个工具调用前 + 最后一段文字) 结束时, 用量数据更新一次
const STEPS = [2.4, 3.5, 4.9, 6.6, 8.7]
const CTX_TOK = [82_000, 86_000, 91_000, 99_500, 103_000, 104_500]
const CTX_WIN = 200_000
const FIVE = [23.0, 23.6, 24.4, 25.3, 26.1, 26.8]
const WEEK = [41.2, 41.3, 41.4, 41.6, 41.8, 42.0]
const COST = [3.12, 3.19, 3.27, 3.36, 3.44, 3.51]
const OUT_DELTA = [0, 380, 520, 1650, 210, 260]
const NOW0 = Date.UTC(2026, 9, 6, 6, 0, 0)
const SESSION_MS = (1 * 3600 + 12 * 60 + 5) * 1000

const stepIdx = t => STEPS.filter(s => t >= s).length
function tokensAt(t) {
  const k = stepIdx(t)
  let total = 18_420_000, output = 91_200
  for (let i = 1; i <= k; i++) {
    total += CTX_TOK[i] + OUT_DELTA[i]
    output += OUT_DELTA[i]
  }
  return { total, output }
}

// 某一时刻 usage-hud 看到的会话状态 (对应源码里的模块变量和 $.session.usage())
function hudState(t) {
  const fi = Math.floor((t * 1000) / FRAME_MS)
  const frame = FRAME0 + fi
  const working = t >= ENTER && t < COMPLETE
  const running = TOOLS.find(x => t >= x.start && t < x.end)
  const counts = { Read: 6, Bash: 4, Write: 3, Grep: 2 }
  let turnTools = 0
  for (const x of TOOLS) if (t >= x.start) {
    counts[x.tool] = (counts[x.tool] ?? 0) + 1
    turnTools++
  }
  const k = stepIdx(t)
  const target = arr => f => arr[stepIdx((f * FRAME_MS) / 1000)]
  const ctxPct = tk => Math.round((tk / CTX_WIN) * 100)
  const done = t >= COMPLETE
  return {
    frame,
    working,
    currentTool: running ? running.tool : '',
    now: NOW0 + t * 1000,
    startedAt: NOW0 - SESSION_MS,
    turnStartedAt: NOW0 + ENTER * 1000,
    lastTurnMs: done ? Math.round((COMPLETE - ENTER) * 1000) : 64_000,
    lastTurnTools: done ? 4 : 6,
    modelId: 'claude-opus-5-5',
    effort: 'high',
    project: 'my-app',
    branch: 'main',
    dirty: 0,
    costUsd: COST[k],
    ctx: { pct: ctxPct(CTX_TOK[k]), tokens: CTX_TOK[k], window: CTX_WIN },
    five: { percentUsed: FIVE[k], resetsInMs: (2 * 3600 + 41 * 60 + 10) * 1000 },
    week: { percentUsed: WEEK[k], resetsInMs: (3 * 86400 + 6 * 3600 + 20 * 60) * 1000 },
    // 会话已经跑了一阵, 显示值早已追上目标: 从当前目标起步, 之后每帧按源码的 ease() 追
    shown: {
      ctx: easeAt(f => ctxPct(CTX_TOK[stepIdx((f * FRAME_MS) / 1000)]), fi, ctxPct(CTX_TOK[0])),
      h5: easeAt(target(FIVE), fi, FIVE[0]),
      wk: easeAt(target(WEEK), fi, WEEK[0]),
    },
    tok: { state: 'ready', ...tokensAt(t) },
    toolCounts: counts,
    agents: 0,
    celebrating: t >= COMPLETE && (t - COMPLETE) * 1000 < CELEBRATE_MS,
    sleeping: false,
  }
}

// ---------------- 一帧终端画面 ----------------
function drawTerminal(win, canvasApi, t) {
  const { ctx, m } = canvasApi(win)
  const g = new Grid(COLS, ROWS)
  const items = []
  if (t >= ENTER) items.push({ kind: 'user', text: PROMPT })
  for (const x of TOOLS) {
    if (t < x.start) continue
    const ok = t >= x.end
    items.push({ kind: 'tool', name: x.name, args: x.args, state: ok ? 'ok' : 'run', blink: !ok && Math.floor((t - x.start) / 0.4) % 2 === 1, result: ok ? [x.result] : [] })
  }
  if (t >= FINAL_AT) items.push({ kind: 'text', text: typed(FINAL, t, FINAL_AT, (FINAL_END - FINAL_AT) / [...FINAL].length) })
  transcript(g, 0, items)

  const working = t >= ENTER && t < COMPLETE
  if (working) spinner(g, 17, t, Math.round(t - ENTER))
  const text = t < ENTER ? typed(PROMPT, t, TYPE_AT, TYPE_DT) : ''
  const typing = t >= TYPE_AT && t < ENTER
  inputBox(g, 19, text, typing || Math.floor(t / 0.53) % 2 === 0)
  // 面板画在 PromptHint 里: 可用宽度 = viewport.columns - 2 (源码), 从第 1 列开始
  drawHud(g, 22, 1, COLS - 2, hudState(t))
  hint(g, 25)
  drawGrid(ctx, g, 0, 0, m)
}

// ---------------- 舞台 ----------------
makeStage(W, H)
const winX = Math.round((W - (COLS * CW + 24)) / 2)
const win = termWindow({ x: winX, y: 64, cols: COLS, rows: ROWS, cw: CW, ch: CH, size: SIZE, title: 'my-app' })
// 循环衔接: 结尾把画面淡回开头那一帧
const body = win.el.querySelector('.termbody')
body.style.position = 'relative'
const fadeCv = document.createElement('canvas')
fadeCv.style.cssText = `position:absolute;left:12px;top:9px;width:${COLS * CW}px;height:${ROWS * CH}px;`
body.appendChild(fadeCv)
const fadeWin = { ...win, canvas: fadeCv }
function canvasOf(w) {
  const dpr = window.devicePixelRatio || 1
  const cv = w.canvas
  if (cv.width !== COLS * CW * dpr) {
    cv.width = COLS * CW * dpr
    cv.height = ROWS * CH * dpr
  }
  const ctx = cv.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.fillStyle = '#0c0c0c'
  ctx.fillRect(0, 0, COLS * CW, ROWS * CH)
  return { ctx, m: metrics(ctx, CW, CH, SIZE) }
}

// 标题: 左边是放大 4 倍的同一只螃蟹 (和面板里的螃蟹同一帧、同一套像素), 方便看清动作
const CRAB_PX = 4
const cap = document.createElement('div')
cap.className = 'caption'
cap.style.left = winX + 4 + 'px'
cap.style.top = '17px'
cap.innerHTML = `<canvas id="capcrab" style="width:${15 * CRAB_PX}px;height:${6 * CRAB_PX}px;align-self:center"></canvas><b>usage-hud</b><span>Claude Code 输入框下方的用量面板 · 像素小螃蟹跟着工具做动作</span>`
document.body.appendChild(cap)
function drawCapCrab(t) {
  const cv = document.getElementById('capcrab')
  const dpr = window.devicePixelRatio || 1
  const w = 15 * CRAB_PX, h = 6 * CRAB_PX
  if (cv.width !== w * dpr) {
    cv.width = w * dpr
    cv.height = h * dpr
  }
  const ctx = cv.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, w, h)
  const s = hudState(t)
  setFrame(s.frame)
  const px = scenePx({ working: s.working, kind: toolKind(s.currentTool), pct: s.ctx.pct, celebrating: s.celebrating, sleeping: s.sleeping, agents: s.agents })
  px.forEach((row, y) => row.forEach((c, x) => {
    if (c < 0) return
    ctx.fillStyle = '#' + c.toString(16).padStart(6, '0')
    ctx.fillRect(x * CRAB_PX, y * CRAB_PX, CRAB_PX, CRAB_PX)
  }))
}

window.demo = {
  width: W,
  height: H,
  fps: FPS,
  duration: DURATION,
  check: [1.0, 2.8, 4.0, 5.6, 7.2, 9.3, 10.6], // 抽查用的时刻 (秒)
  gif: { dither: 'bayer:bayer_scale=4' },
  ready: Promise.all([document.fonts.load('13px "Cascadia Mono"'), document.fonts.load('bold 13px "Cascadia Mono"'), document.fonts.ready]),
  renderFrame(t) {
    drawCapCrab(t)
    drawTerminal(win, canvasOf, t)
    const k = easeOut(seg(t, FADE_AT, DURATION - 1 / FPS))
    fadeCv.style.display = k > 0 ? 'block' : 'none'
    fadeCv.style.opacity = k
    if (k > 0) drawTerminal(fadeWin, canvasOf, 0)
  },
}
</script>
</body>
</html>
